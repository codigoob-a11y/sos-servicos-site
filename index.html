<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Serviços | Solicitar Socorro Técnico Imediato</title>
    <style>
        :root { 
            --bg: #0b0f19; 
            --card: #151f32; 
            --input: #1e293b; 
            --azul: #38bdf8; 
            --texto: #f8fafc; 
            --texto-mutado: #64748b;
        }
        body { 
            background-color: var(--bg); 
            color: var(--texto); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        header { 
            text-align: center; 
            margin-bottom: 35px; 
            padding: 20px 0;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, transparent 100%);
            border-radius: 12px;
        }
        header h1 { color: var(--azul); font-size: 2.6rem; margin: 0; font-weight: 800; }
        header p { color: #94a3b8; margin-top: 8px; font-size: 1.1rem; }
        main { max-width: 700px; margin: 0 auto; }
        .secao-container { 
            background-color: var(--card); 
            padding: 30px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .formulario-grupo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 600; font-size: 0.95rem; }
        select, input, textarea { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            background-color: var(--input); 
            color: #fff; 
            border: 1px solid #1e293b; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--azul); }
        .btn-principal { 
            background-color: var(--azul); 
            color: var(--bg); 
            font-weight: 700; 
            padding: 16px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1.1rem; 
            transition: 0.2s;
        }
        .btn-principal:hover { filter: brightness(1.1); transform: translateY(-1px); }
        
        .rodape-link {
            text-align: center;
            margin-top: 25px;
        }
        .rodape-link a {
            color: var(--azul);
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚠️ SOS Serviços</h1>
        <p>Solicite Socorro Técnico Especializado de Forma Gratuita</p>
    </header>

    <main>
        <div class="secao-container">
            <h2 style="margin-top:0; margin-bottom: 20px; font-size: 1.4rem;">Descreva o que você precisa:</h2>
            <form onsubmit="cadastrarPedidoCliente(event)">
                <div style="margin-bottom:15px;">
                    <label>Seu Nome Completo</label>
                    <input type="text" id="cli-nome" placeholder="Ex: Carlos Silva" required />
                </div>
                
                <div class="formulario-grupo">
                    <div>
                        <label>Categoria do Serviço</label>
                        <select id="cli-categoria">
                            <option value="⚡ Eletricista">⚡ Eletricista</option>
                            <option value="🪠 Encanador">🪠 Encanador</option>
                            <option value="🧹 Diarista">🧹 Diarista</option>
                            <option value="🛠️ Serviços Gerais">🛠️ Serviços Gerais</option>
                            <option value="🧱 Pedreiro">🧱 Pedreiro / Construtor</option>
                            <option value="🎨 Pintor">🎨 Pintor Residencial</option>
                            <option value="❄️ Técnico de Ar Condicionado">❄️ Técnico de Ar Condicionado</option>
                            <option value="🚗 Mecânico Automotivo">🚗 Mecânico Automotivo</option>
                            <option value="📱 Técnico de Celular/PC">📱 Técnico de Celular/PC</option>
                            <option value="🪚 Marceneiro">🪚 Marceneiro / Carpinteiro</option>
                            <option value="🔒 Chaveiro">🔒 Chaveiro 24h</option>
                            <option value="🛋️ Estofador">🛋️ Limpeza/Reforma de Estofados</option>
                            <option value="🌱 Jardineiro">🌱 Jardineiro / Paisagista</option>
                            <option value="🦟 Dedetizador">🦟 Dedetizador / Controle de Pragas</option>
                            <option value="🏡 Marido de Aluguel">🏡 Marido de Aluguel (Pequenos Reparos)</option>
                        </select>
                    </div>
                    <div>
                        <label>Cidade (Disponível em SP)</label>
                        <input type="text" id="cli-cidade" placeholder="Ex: Araraquara, Matão..." required />
                    </div>
                </div>

                <div class="formulario-grupo">
                    <div>
                        <label>Bairro</label>
                        <input type="text" id="cli-bairro" placeholder="Ex: Vila Xavier, Centro..." required />
                    </div>
                    <div>
                        <label>WhatsApp com DDD</label>
                        <input type="text" id="cli-whatsapp" placeholder="Ex: 16999999999 (Apenas números)" required />
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <label>Explique o Problema Detalhadamente</label>
                    <textarea id="cli-descricao" rows="4" placeholder="Descreva o que o profissional precisa resolver..." required></textarea>
                </div>

                <button type="submit" class="btn-principal">🚀 Publicar Chamado Gratuitamente</button>
            </form>
        </div>

        <div class="rodape-link">
            <a href="profissional.html">💼 Sou um Profissional Autônomo e Quero Ver o Mural →</a>
        </div>
    </main>
    <script>
        function cadastrarPedidoCliente(e) {
            e.preventDefault();
            
            // Puxa e limpa a lista de leads existente
            let leadsBase = JSON.parse(localStorage.getItem('sos_leads_mural')) || [
                { id: 801, nome: "Carlos Silva", categoria: "⚡ Eletricista", cidade: "Araraquara", bairro: "Vila Xavier", descricao: "Troca de fiação de chuveiro queimado de urgência. O disjuntor geral está desarmando.", whatsapp: "16997654321" },
                { id: 802, nome: "Mariana Souza", categoria: "🪠 Encanador", cidade: "Matão", bairro: "Centro", descricao: "Vazamento grave oculto na parede do banheiro que está infiltrando no vizinho.", whatsapp: "16998123456" }
            ];

            const novoLead = {
                id: Math.floor(Math.random() * 9000) + 1000,
                nome: document.getElementById('cli-nome').value,
                categoria: document.getElementById('cli-categoria').value,
                cidade: document.getElementById('cli-cidade').value,
                bairro: document.getElementById('cli-bairro').value,
                descricao: document.getElementById('cli-descricao').value,
                whatsapp: document.getElementById('cli-whatsapp').value.replace(/\D/g, '')
            };

            // Injeta o novo pedido no topo da base de dados comercial
            leadsBase.unshift(novoLead);
            localStorage.setItem('sos_leads_mural', JSON.stringify(leadsBase));

            // Limpa todos os campos da tela
            document.getElementById('cli-nome').value = '';
            document.getElementById('cli-bairro').value = '';
            document.getElementById('cli-descricao').value = '';
            document.getElementById('cli-whatsapp').value = '';

            alert('Seu SOS foi publicado com sucesso! Os profissionais especialistas já foram notificados na região.');
            
            // Redireciona o cliente para uma tela visual limpa ou recarrega
            window.location.reload();
        }
    </script>
</body>
</html>
